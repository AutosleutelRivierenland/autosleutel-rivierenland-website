name: Extract original job photos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract original photos
        run: |
          mkdir -p public/real-photos
          unzip -o autosleutel-rivierenland-fotos-origineel.zip -d public/real-photos
          find public/real-photos -maxdepth 1 -type f -print

      - name: Commit extracted photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/real-photos
          if git diff --cached --quiet; then
            echo "No new photos to commit."
          else
            git commit -m "Add original real job photos"
            git push
          fi
